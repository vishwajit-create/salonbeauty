<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Admin - Audit Logs</title>
</head>
<body>
  <h1>Audit Logs</h1>
  <div id="list"></div>
  <script>
    async function fetchLogs() {
      const token = prompt('Enter ADMIN access token');
      if (!token) return;
      const res = await fetch('/admin/audit', { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json();
      const container = document.getElementById('list');
      if (!data.ok) { container.innerText = 'Error: ' + data.message; return; }
      container.innerHTML = '';
      data.items.forEach(s => {
        const el = document.createElement('div');
        el.innerHTML = `<div><strong>${s.action}</strong> by ${s.performedBy?.mobile || 'system'} at ${s.created_at}<br/>IP: ${s.ip || '-'} UA: ${s.user_agent || '-'}<pre>${JSON.stringify(s.details)}</pre><hr/></div>`;
        container.appendChild(el);
      });
    }
    fetchLogs();
  </script>
</body>
</html>
